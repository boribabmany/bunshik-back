spring.application.name=bunshik-back

spring.config.import=optional:file:./.env[.properties]

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

mybatis.mapper-locations=classpath:/mappers/**/*.xml
mybatis.type-aliases-package=com.bunshik.common.entity

mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

# JWT 설정
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:3600000}

# 파일 업로드 용량 제한 (메뉴/옵션 이미지)
# 0805 수정전 spring.servlet.multipart.max-file-size=10MB
# 0805 수정전 spring.servlet.multipart.max-request-size=10MB

#0805수정후
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB
server.tomcat.max-part-count=200

#토스페이
toss.secret-key=${TOSS_SECRET_KEY}